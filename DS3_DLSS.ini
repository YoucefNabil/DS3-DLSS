; DS3_DLSS - place next to DarkSoulsIII.exe together with d3d11.dll

[General]
; 0 = pure pass-through proxy (no D3D11 hooks, no DLAA). The [Widescreen],
; [FrameRate] and [Window] sections below have their own switches.
Enabled=1

[Debug]
; For testing and development only. 0 = everything in this section is off
; (hotkeys, dumps, captures, DebugView), whatever it is set to below.
; 1 = on. The [DLSS] ToggleKey (Home) works either way.
Enabled=0
; Virtual-key code. Press in game to write the next frame's pass list to
; DS3_DLSS_frame_<time>.txt (default 0x79 = F10)
DumpFrameKey=0x79
; Also dump automatically after this many frames (0 = off)
DumpFrameAt=0
; Save every shader's bytecode to DS3_DLSS_shaders\ for analysis (0 = off)
DumpShaders=0
; Capture for tools\capture_replay (anti-aliasing work): press in game to save
; the next CaptureFrames frames of what DLSS gets (scene colour, depth,
; motion vectors, masks, camera) and what it produced, into
; DS3_DLSS_capture_<date>_<time>\ next to the DLL. About 95 MB per frame at
; 1080p, 380 MB at 4K; the game hitches while it saves. (default 0x78 = F9)
CaptureKey=0x78
CaptureFrames=48
; Also capture automatically from this frame on (0 = off)
CaptureAt=0
; Virtual-key code that switches the mip bias ([DLSS] MipBias) on/off for A/B
; comparison (default 0x23 = End)
MipBiasKey=0x23
; Debugging overlays, drawn over the final frame:
; 1 = motion vectors, 2 = reactive mask (white = effect, DLSS trusts the current frame)
; 3 = motion vector check: last frame moved along the motion vectors, compared with
;     this frame. Dark = correct, red = wrong vector (smears / blurs in motion) or
;     just uncovered (a thin edge behind moving things is normal), blue = off screen.
DebugView=0

[Jitter]
; TEST ONLY. DLAA jitters the camera by itself; leave this at 0.
; 1 = jitter the main camera without DLAA (the image wobbles slightly).
Enabled=0
; Multiplies the offset so it is easy to see (e.g. 8). Keep 1 for real use.
DebugScale=1.0

[DLSS]
; DLAA (DLSS at native resolution). Set the in-game Anti-aliasing option to Off.
; Needs an RTX GPU and nvngx_dlss.dll next to the exe. 0 = off
Enabled=1
; DLSS preset letter (e.g. K), or Default to let the driver / NVIDIA App decide
Preset=Default
; Direction of the jitter reported to DLSS. 1 is correct in tests; only try -1
; if the image looks soft or crawls while standing still.
JitterSign=1
; 1 = motion vectors for moving characters/enemies, taken from the game's
; motion blur pass (keeps them sharp). 0 = camera motion only.
; NEEDS the in-game Motion Blur option ON, or the game never draws that pass.
ObjectMotion=1
; Reactive mask strength for transparent effects (fire, torches, spells, bonfire
; glow, particles). They have no motion vectors of their own, so DLSS can leave
; trails behind them; where an effect makes up most of a pixel, DLSS trusts the
; current frame instead. 0 = off, 1 = default, up to ~2 = stronger (fewer trails,
; slightly more aliasing under the effect).
Reactive=1
; Texture sharpness while DLAA runs (mip LOD bias). Negative values pick sharper
; texture mips for the 3D scene (armour, cloth, ground); DLSS keeps them stable.
; 0 = off (the game's own mips), -0.5 = default, -1 = NVIDIA's value for DLAA.
; Too low can shimmer on fine patterns like chainmail. The UI is not affected.
MipBias=-0.5
; Virtual-key code that toggles DLAA on/off for A/B comparison (default 0x24 = Home).
; The only hotkey that works without [Debug] Enabled=1.
ToggleKey=0x24

[Widescreen]
; Any resolution / aspect ratio (ultrawide, phone streaming such as 2376x1080).
; The game only offers 16:9 sizes. With this on, the first entry of its list
; (800x450) is replaced with the size below. That entry is the only change to
; game memory, and it is skipped when the size is a normal 16:9 one anyway.
; Use the game in windowed mode ([Window] Borderless=1 below is fine).
; 0 = off (default). The game's memory is then not touched at all.
Enabled=0
; 0 = your display's current resolution, read at each game start (follows
; the stream's virtual display). Or set a fixed size, e.g. Width=2560 Height=1080
Width=0
Height=0
; 1 = also save that size as the game's resolution (%APPDATA%\DarkSoulsIII\
; GraphicsConfig.xml) at each start, so the game opens at it without a menu
; visit. 0 = pick the new size in the game's settings yourself. A size picked
; in game during a session is not kept: the next start uses the display again.
FollowDisplay=1

[FrameRate]
; Replaces the game's 60 fps cap with FPS, using the game's own (debug) frame
; limiter. Vsync is then off: use a G-Sync / FreeSync display, or set FPS to
; your refresh rate. Do not use together with DS3DebugFps (D3DCompiler_43.dll
; + FPSconfig.ini): while those files are there, this section is skipped.
; 0 = off (default, the game's memory is not touched).
Unlock=0
; Above ~82 fps the game slows sprinting down (its "stuck while sprinting" check
; counts distance per frame, tuned for 60 fps). With FPS above 80 the mod fixes
; that automatically (a hook on that one function). At 80 or below the bug does
; not happen, so no game code is changed: only the frame limiter values.
FPS=120

[Window]
; 1 = borderless window: set the game to windowed mode and the window loses
; its frame and covers the whole monitor (a lower game resolution is
; stretched, like DS3DebugFps). Switching windowed / full screen in game works
; without a restart; full screen itself is left alone. Alt-tab works: the
; window is never "always on top", and the game no longer pulls the mouse
; cursor back while it is in the background. Skipped while DS3DebugFps is
; installed (it has its own).
Borderless=0
